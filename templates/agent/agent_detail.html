{% extends 'base.html' %}

{% block content %}

<section class="text-gray-600 body-font overflow-hidden">
  <div class="container px-5 py-24 mx-auto">
    <div class="lg:w-4/5 mx-auto flex flex-wrap">
      <div class="lg:w-1/2 w-full lg:pr-10 lg:py-6 mb-6 lg:mb-0">
        <h2 class="text-sm title-font text-gray-500 tracking-widest">Agent Details</h2>
        <div class="flex mb-4">
          <a class="flex-grow text-indigo-500 border-b-2 border-indigo-500 py-2 text-lg px-1">Overview</a>
          <a class="flex-grow border-b-2 border-gray-300 py-2 text-lg px-1">Reviews</a>
          <a href="{% url 'agents:edit_agent_details' agent.pk %}" class="flex-grow border-b-2 border-gray-300 py-2 text-lg px-1">Update Details</a>
        </div>
        <div class="flex border-t border-gray-200 py-2">
          <span class="text-gray-500">Agent Username: {{ agent.user.username }} </span>
        </div>
        <div class="flex border-t border-gray-200 py-2">
          <span class="text-gray-500">Agent Email: {{ agent.user.email }} </span>
        </div>
        <div class="flex mt-3">
          <button class="w-1/2 flex ml-auto text-white bg-indigo-500 border-0  focus:outline-none rounded">
            <a class="py-3 px-6 text-center" href="{% url 'agents:delete_agent' agent.pk %}">Delete</a>
          </button>
        </div>
      </div>
      <img alt="agent Image" class="lg:w-1/2 w-full lg:h-auto h-64 object-cover object-center rounded" src="https://dummyimage.com/400x400">
    </div>
  </div>
</section>
    
{% endblock content %}
