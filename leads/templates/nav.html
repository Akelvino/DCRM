<header class="text-gray-600 body-font">
  <div class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center border-b border-gray-300">
    <a href="{% url 'home' %}" class="flex title-font font-medium items-center text-gray-900 mb-4 md:mb-0">
      <span class="ml-3 text-xl cursor-pointer">DJ CRM</span>
    </a>
    {% if user.is_authenticated %}
      <nav class="md:ml-auto flex flex-wrap items-center text-base justify-center gap-3">
        <div>
          <p>{{ user }} loged in</p>
        </div>
        <div>
          <form method="POST" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="hover:text-gray-900 cursor-pointer">
                  Log out
              </button>
          </form>
        </div>
      </nav>
    {% else %}
      <nav class="md:ml-auto flex flex-wrap items-center text-base justify-center">
        
        <a href="{% url 'signup' %}" class="mr-5 hover:text-gray-900">Sign Up</a>
      </nav>
      <button class="inline-flex items-center bg-gray-100 border-0 py-1 px-3 focus:outline-none hover:bg-gray-200 rounded text-base mt-4 md:mt-0">
        <a href="{% url 'login' %}">Login</a>
      </button>
    {% endif %}
  </div>
</header>
