{% extends 'base.html' %}

{% block content %}
    <a href="{% url 'create-lead' %}">Create lead</a>
        <hr>
        <h1>List of Leads</h1>
        <ol>
            {% for lead in leads %}
                <li><a href="{% url 'lead-detail' lead.pk %}">{{ lead.first_name }} {{ lead.last_name }}</a></li>
            {% endfor %}
        </ol>
{% endblock content %}
