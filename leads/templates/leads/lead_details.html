{% extends 'base.html' %}

{% block content %}
    <a href="{% url 'home' %}">Go back</a>
    <hr>
    <h1>{{ lead.first_name }} Details</h1>
    <p>Full name: {{ lead.first_name }} {{ lead.last_name }}</p>
    <p>Age: {{ lead.age }}</p>
    <p>The agent is {{ lead.agent }}</p>
    <hr>
    <a href="{% url 'lead-update' lead.pk %}">Edit</a>
    <a href="{% url 'lead-delete' lead.pk %}">Delete</a>
{% endblock content %}
